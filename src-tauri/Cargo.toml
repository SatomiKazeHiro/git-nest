[package]
name = "git-nest"
version = "0.1.0"
description = "git-nest 的桌面壳"
edition = "2021"
# 跟着 workspace 根 package.json 的 license/version 走；桌面壳本身不对外发布，
# 这里只是 Cargo 要求的元数据。
publish = false

# 默认就是 src/main.rs；显式写出来是为了说明 desktop 库与 bin 的分工
[lib]
# Tauri v2 的推荐形态：逻辑放 lib（desktop），bin 只做一行入口。
# 理由写在 src/main.rs 与 src/lib.rs 的注释里（移动端入口复用同一个 lib）。
name = "git_nest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri v2（不是 v1）。tauri-build 负责代码生成、能力文件校验、schema 生成。
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 核心。default features 里包含 wry webview 与系统 webview 绑定。
tauri = { version = "2", features = [] }
# Tauri v2 的插件式 shell：v2 把 v1 的 allowlist 换成了插件 + ACL 权限，
# 拉起 sidecar 走的就是这个插件的 Rust API（见 src/lib.rs）。
tauri-plugin-shell = "2"
# 目录选择框（添加项目时那枚「选择目录…」）。v2 里系统对话框也是插件：
# 注册之后 `window.__TAURI__.dialog.open` 才存在，前端靠它判断这项能力有没有
# （判定收在 `apps/web/src/lib/platform.ts`，别处不许直接读 `__TAURI__`）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri v2 的日志插件：写 stderr + 数据根下的 logs/git-nest.log。
# 为什么需要它：Windows 的 release 没有控制台，资源管理器里双击启动时，
# 之前只有 eprintln! 的那几行（「已拉起 sidecar」/「sidecar 退出 code=1」）会全部丢掉
# ——真实的 EISDIR 事故就是这么被藏了一整轮的（那两行还是 Node 打出来的，
# 现在 sidecar 的 stdout/stderr 也会转发进这份日志）。
tauri-plugin-log = "2"
# 壳自己的日志门面（log_line 走它）。范围写小，跟别的依赖保持一致。
log = "0.4"
# 启动失败时的系统弹窗。只在「数据根定不下来」那条死路上用：那一刻 webview
# 还没建出来，tauri-plugin-dialog 是指不上的——而 release 没有控制台，不弹窗
# 用户只会看到「点了没反应」。
rfd = "0.15"
