    <!--

      图样沿用界面的语汇：accent 圆角方块 + 一个分支（主干两个节点 + 右上一条支线）。
    -->

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314506E'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M5.5 5v7'/%3E%3Cpath d='M5.5 8.5h3.5a2 2 0 0 0 2-2v-.5'/%3E%3C/g%3E%3Ccircle cx='5.5' cy='3.9' r='1.6' fill='%23fff'/%3E%3Ccircle cx='5.5' cy='12.6' r='1.6' fill='%23fff'/%3E%3Ccircle cx='11' cy='4.4' r='1.6' fill='%23fff'/%3E%3C/svg%3E"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
